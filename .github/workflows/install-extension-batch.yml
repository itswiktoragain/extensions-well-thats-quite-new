name: Install extension batch

on:
  push:
    branches:
      - new-extension-batch-2026-09-30
    paths:
      - ".tmp-extension-batch.b64"
      - ".github/workflows/install-extension-batch.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-extension-batch-2026-09-30

      - name: Install tested files and update catalog
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp-extension-batch.b64 > /tmp/extbatch.tgz
          tar -xzf /tmp/extbatch.tgz

          python3 <<'PY'
          from pathlib import Path

          catalog = Path("extensions/extensions.json")
          text = catalog.read_text()
          marker = '  "itswiktoragain/gemini-api",\n'
          additions = (
              '  "itswiktoragain/url-tools",\n'
              '  "itswiktoragain/procedural-noise",\n'
              '  "itswiktoragain/seeded-random",\n'
              '  "itswiktoragain/csv",\n'
              '  "itswiktoragain/text-metrics",\n'
              '  "itswiktoragain/geometry",\n'
              '  "itswiktoragain/byte-buffer",\n'
              '  "itswiktoragain/text-similarity",\n'
              '  "itswiktoragain/grid-pathfinding",\n'
          )
          if "itswiktoragain/url-tools" not in text:
              if marker not in text:
                  raise SystemExit("Could not find catalog insertion point")
              catalog.write_text(text.replace(marker, marker + additions))

          readme = Path("images/README.md")
          image_text = readme.read_text()
          attribution = """
          
          ## itswiktoragain/url-tools.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/procedural-noise.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/seeded-random.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/csv.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/text-metrics.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/geometry.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/byte-buffer.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/text-similarity.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          
          ## itswiktoragain/grid-pathfinding.svg
           - Created for [@itswiktoragain](https://scratch.mit.edu/users/Wind-Z/) with ChatGPT assistance.
          """
          if "## itswiktoragain/url-tools.svg" not in image_text:
              readme.write_text(image_text.rstrip() + "\n" + attribution.lstrip())
          PY

          rm .tmp-extension-batch.b64
          rm .github/workflows/install-extension-batch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add nine focused custom extensions"
          git push origin HEAD:new-extension-batch-2026-09-30
