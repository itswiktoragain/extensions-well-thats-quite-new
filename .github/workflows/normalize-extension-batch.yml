name: Normalize new extension batch

on:
  push:
    branches:
      - new-extension-batch-2026-09-30
    paths:
      - ".github/workflows/normalize-extension-batch.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: new-extension-batch-2026-09-30

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fix translation calls and format new extensions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          names = [
              "url-tools", "procedural-noise", "seeded-random", "csv",
              "text-metrics", "geometry", "byte-buffer",
              "text-similarity", "grid-pathfinding"
          ]
          for name in names:
              path = Path(f"extensions/itswiktoragain/{name}.js")
              text = path.read_text()
              text = text.replace("  const T = Scratch.translate;\n", "")
              text = re.sub(r"\bT\(", "Scratch.translate(", text)
              path.write_text(text)
          PY

          npx prettier --write             extensions/itswiktoragain/url-tools.js             extensions/itswiktoragain/procedural-noise.js             extensions/itswiktoragain/seeded-random.js             extensions/itswiktoragain/csv.js             extensions/itswiktoragain/text-metrics.js             extensions/itswiktoragain/geometry.js             extensions/itswiktoragain/byte-buffer.js             extensions/itswiktoragain/text-similarity.js             extensions/itswiktoragain/grid-pathfinding.js

          npx eslint --max-warnings=0             extensions/itswiktoragain/url-tools.js             extensions/itswiktoragain/procedural-noise.js             extensions/itswiktoragain/seeded-random.js             extensions/itswiktoragain/csv.js             extensions/itswiktoragain/text-metrics.js             extensions/itswiktoragain/geometry.js             extensions/itswiktoragain/byte-buffer.js             extensions/itswiktoragain/text-similarity.js             extensions/itswiktoragain/grid-pathfinding.js

          rm .github/workflows/normalize-extension-batch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize new extension code style"
          git push origin HEAD:new-extension-batch-2026-09-30
