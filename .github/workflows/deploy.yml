name: Deploy Dry Eggs Extension Library

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "dry-eggs-extension-library"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'itswiktoragain/extensions-well-thats-quite-new' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build extension library
        run: npm run build
      - name: Point generated site at Dry Eggs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('build');
          const replacements = [
            ['https://extensions.turbowarp.org/', 'https://itswiktoragain.github.io/extensions-well-thats-quite-new/'],
            ['https://turbowarp.org/editor', 'https://itswiktoragain.github.io/scratch-gui/editor.html'],
            ['TurboWarp Extension Gallery', 'Dry Eggs Extension Library'],
            ['The official place to find powerful unsandboxed extensions for TurboWarp.', 'Extensions and extra capabilities for Dry Eggs.']
          ];
          const rewrite = file => {
            const ext = path.extname(file).toLowerCase();
            if (ext !== '.html' && ext !== '.json') return;
            let text = fs.readFileSync(file, 'utf8');
            for (const [from, to] of replacements) text = text.split(from).join(to);
            fs.writeFileSync(file, text);
          };
          const walk = dir => {
            for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
              const target = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(target);
              else rewrite(target);
            }
          };
          walk(root);
          NODE
      - name: Verify generated metadata
        run: test -f build/generated-metadata/extensions-v0.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
